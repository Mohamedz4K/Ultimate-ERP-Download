name: Publish verified Mobile APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILE: UltimateERP-Mobile-1.0.20-build30.apk
      APK_URL: https://expo.dev/artifacts/eas/aSlOZVekP-0ErZskk29td07VSWcoMRTg9n5MGU5iu4w.apk
      EXPECTED_SHA256: a7e9f8d68ea8a9cb06493580af3f51ac37c5d8a6dab2a2b7e255d5dac66ee838
    steps:
      - name: Download and verify the approved build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 "$APK_URL" --output "$FILE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$FILE" | sha256sum --check --strict
          test "$(stat --format=%s "$FILE")" = 142636978
      - name: Publish without replacing previous assets
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases/tags/v2.0.0" --jq '.assets[] | select(.name == "UltimateERP-Mobile-1.0.20-build30.apk") | .digest')
          if [ -n "$existing" ]; then
            test "$existing" = "sha256:$EXPECTED_SHA256"
          else
            gh release upload v2.0.0 "$FILE"
          fi
