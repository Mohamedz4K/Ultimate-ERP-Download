name: Publish verified Mobile APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILE: UltimateERP-Mobile-1.0.20-build32-legacy.apk
      APK_URL: https://expo.dev/artifacts/eas/hG6hmeKLAGFbObBHGc1xgRGSYLucE-z_YNQ6EaDFKf4.apk
      EXPECTED_SHA256: 6705f0c31778b1824b51f6048a9517d56ae470abdad27d89272ef97c22223fef
    steps:
      - name: Download and verify the approved build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 "$APK_URL" --output "$FILE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$FILE" | sha256sum --check --strict
          test "$(stat --format=%s "$FILE")" = 142655830
      - name: Publish without replacing previous assets
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases/tags/v2.0.0" --jq '.assets[] | select(.name == "UltimateERP-Mobile-1.0.20-build32-legacy.apk") | .digest')
          if [ -n "$existing" ]; then
            test "$existing" = "sha256:$EXPECTED_SHA256"
          else
            gh release upload v2.0.0 "$FILE"
          fi
